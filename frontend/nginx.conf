server {
    listen 80;

    # =========================================
    # Servir los archivos estaticos de React
    # (el resultado del "npm run build")
    # =========================================
    root /usr/share/nginx/html;
    index index.html;

    # Para React Router: si la ruta no existe como archivo,
    # devuelve index.html y React maneja la navegacion
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================
    # Proxy inverso hacia el backend Spring Boot
    # Cualquier peticion que empiece con /tareas
    # se redirige al contenedor "backend" en el puerto 8080
    # "backend" es el nombre del servicio en docker-compose.yml
    # =========================================
    location /tareas {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
