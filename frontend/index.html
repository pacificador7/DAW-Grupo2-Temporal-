<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas y Proyectos</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header" id="inicio">
        <h1>Gestión de Tareas y Proyectos</h1>

        <nav class="navbar">
            <a href="#inicio">Inicio</a>
            <a href="tareas.html">Tareas</a>
            <a href="#crear">Crear</a>
            <a href="#editar">Editar</a>
        </nav>
    </header>

    <main class="contenedor">

        <!-- GET -->
        <section class="seccion" id="tareas">
            <h2>Listado de tareas</h2>
            <table id="tareas-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="tareas-body">
                </tbody>
            </table>
        </section>

        <!-- POST -->
        <section class="seccion" id="crear">
            <h3>Crear tarea</h3>
            <form id="form-crear" novalidate>
                <div class="form-group">
                    <label for="crear-nombre">Nombre <span class="obligatorio">*</span></label>
                    <input type="text" id="crear-nombre" name="nombre" placeholder="Nombre de la tarea" maxlength="80" />
                    <span class="error-msg" id="err-crear-nombre">Este campo es obligatorio.</span>
                </div>
                <div class="form-group">
                    <label for="crear-descripcion">Descripción <span class="obligatorio">*</span></label>
                    <textarea id="crear-descripcion" name="descripcion" placeholder="Descripción de la tarea"></textarea>
                    <span class="error-msg" id="err-crear-descripcion">Este campo es obligatorio.</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="crear-estado">Estado <span class="obligatorio">*</span></label>
                        <select id="crear-estado" name="estado">
                            <option value="" disabled selected>Seleccionar</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En progreso">En progreso</option>
                            <option value="Completada">Completada</option>
                        </select>
                        <span class="error-msg" id="err-crear-estado">Selecciona un estado.</span>
                    </div>
                    <div class="form-group">
                        <label for="crear-fecha">Fecha límite <span class="obligatorio">*</span></label>
                        <input type="date" id="crear-fecha" name="fecha" />
                        <span class="error-msg" id="err-crear-fecha">Selecciona una fecha.</span>
                    </div>
                </div>
                <div class="form-botones">
                    <button type="button" class="btn-cancelar" onclick="limpiarFormCrear()">Cancelar</button>
                    <button type="submit" class="btn-crear">Crear tarea</button>
                </div>
            </form>
            <p id="msg-crear" class="msg-exito" style="display:none;">✓ Tarea creada correctamente.</p>
        </section>

        <!-- PUT -->
        <section class="seccion" id="editar">
            <h3>Editar tarea</h3>
        </section>

        <!-- DELETE -->
        <section class="seccion" id="eliminar">
            <h3>Eliminar tarea</h3>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
