<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Tareas - Gestión de Tareas y Proyectos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Gestión de Tareas y Proyectos</h1>
        <nav class="navbar">
            <a href="index.html">Inicio</a>
            <a href="tareas.html">Tareas</a>
            <a href="index.html#crear">Crear</a>
            <a href="index.html#editar">Editar</a>
        </nav>
    </header>

    <main class="contenedor-principal">
        <section class="seccion">
            <h2>Listado de Tareas</h2>

            <!-- Filtros -->
            <div class="filtros">
                <label for="buscar-nombre">Buscar por nombre:</label>
                <input type="text" id="buscar-nombre" placeholder="Escribe el nombre...">

                <label for="filtrar-estado">Filtrar por estado:</label>
                <select id="filtrar-estado">
                    <option value="">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En progreso">En progreso</option>
                    <option value="Completada">Completada</option>
                </select>

                <label for="filtrar-fecha">Filtrar por fecha:</label>
                <input type="date" id="filtrar-fecha">

                <button id="limpiar-filtros">Limpiar filtros</button>
            </div>

            <!-- Tabla de tareas -->
            <table id="tareas-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="tareas-body">
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
