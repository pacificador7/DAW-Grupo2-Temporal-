# Configuracion de Base de Datos
# Las variables de entorno permiten que cada
# desarrollador use su propia contrasena local,
# y Docker use la definida en docker-compose.yml

# DB_HOST: en Docker sera "db" (nombre del servicio)
#          en local sera "localhost"
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:tareas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate

# "validate": Hibernate verifica que las entidades coinciden con el esquema de la BD
# El esquema es creado por schema.sql (docker-entrypoint-initdb.d), no por Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect